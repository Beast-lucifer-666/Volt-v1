name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Dummy Google Services JSON
      run: |
        echo '{"project_info":{"project_number":"12345","project_id":"volt-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:12345:android:12345","android_client_info":{"package_name":"com.energy.volt"}},"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"status":2}}}]}' > app/google-services.json

    - name: Build with Gradle
      run: ./gradlew assembleDebug -x lint
