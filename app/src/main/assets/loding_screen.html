<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Volt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;700&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; }

        html, body {
          width:100%; height:100%;
          background:#04010a;
          display:flex;
          align-items:center;
          justify-content:center;
          overflow:hidden;
          font-family:'Chakra Petch', sans-serif;
        }

        .wrap {
          display:flex;
          flex-direction:column;
          align-items:center;
          gap:24px;
        }

        .stage {
          position:relative;
          width:300px; height:300px;
          display:flex;
          align-items:center;
          justify-content:center;
        }

        /* BLOBS */
        .blob {
          position:absolute;
          border-radius:50%;
          pointer-events:none;
          animation: pulse 4s ease-in-out infinite;
        }
        .blob-v { width:220px; height:180px; background:radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 70%); filter:blur(40px); top:-10px; left:-10px; }
        .blob-e { width:190px; height:160px; background:radial-gradient(circle, rgba(16,185,129,0.18) 0%, transparent 70%);  filter:blur(40px); bottom:-10px; right:-10px; animation-delay:2s; }
        .blob-c { width:150px; height:150px; background:radial-gradient(circle, rgba(100,40,220,0.2)  0%, transparent 70%);  filter:blur(30px); animation-delay:1s; }

        /* ORBITALS */
        .orb1 { position:absolute; width:300px; height:300px; animation:spinCW  9s   linear infinite; transform-origin:150px 150px; }
        .orb2 { position:absolute; width:300px; height:300px; animation:spinCCW 6.5s linear infinite; transform-origin:150px 150px; }

        /* HALO */
        .halo {
          position:absolute;
          width:186px; height:186px;
          border-radius:50%;
          border:1.5px solid rgba(167,139,250,0.3);
          box-shadow:0 0 20px rgba(167,139,250,0.15), inset 0 0 20px rgba(124,58,237,0.08);
          animation:halo 3.5s ease-in-out infinite;
        }

        /* CORE */
        .core {
          position:absolute;
          width:148px; height:148px;
          border-radius:50%;
          background:radial-gradient(circle at 40% 35%, #1e0540, #07011a);
          border:1px solid rgba(124,58,237,0.25);
        }

        /* INNER RING */
        .ering {
          position:absolute;
          width:112px; height:112px;
          border-radius:50%;
          border:1px dashed rgba(16,185,129,0.22);
          animation:spinCCW 12s linear infinite;
        }

        /* BOLT */
        .bolt { position:absolute; animation:glow 3s ease-in-out infinite; }

        /* PARTICLES */
        .p { position:absolute; border-radius:50%; animation:drift 6s ease-in-out infinite; }
        .p1{width:3px;height:3px;background:#a78bfa;top:14%;left:10%;animation-duration:5s;}
        .p2{width:2px;height:2px;background:#10b981;top:75%;left:16%;animation-delay:1s;animation-duration:7s;}
        .p3{width:3px;height:3px;background:#a78bfa;top:28%;right:8%;animation-delay:.5s;}
        .p4{width:2px;height:2px;background:#6ee7b7;top:82%;right:12%;animation-delay:2s;animation-duration:8s;}
        .p5{width:2px;height:2px;background:#c4b5fd;top:50%;left:4%;animation-delay:3s;}
        .p6{width:3px;height:3px;background:#10b981;top:8%;right:20%;animation-delay:1.5s;animation-duration:5.5s;}

        /* TEXT */
        .wordmark {
          font-size:34px; font-weight:700; letter-spacing:0.3em;
          background:linear-gradient(120deg,#ede9fe 0%,#c4b5fd 35%,#a78bfa 65%,#10b981 100%);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
          text-align:center;
        }
        .tagline {
          font-size:9px; font-weight:300; letter-spacing:0.45em;
          color:rgba(167,139,250,0.45); text-transform:uppercase;
          margin-top:4px; text-align:center;
        }

        /* PROGRESS */
        .progress-track { width:180px; height:2px; background:rgba(167,139,250,0.1); border-radius:2px; overflow:hidden; margin-top:12px; }
        .progress-fill  { height:100%; border-radius:2px; background:linear-gradient(to right,#7c3aed,#a78bfa,#10b981); box-shadow:0 0 8px rgba(167,139,250,0.5); animation:progress 2.8s cubic-bezier(.4,0,.2,1) infinite; }
        .progress-label { font-size:8px; font-weight:300; letter-spacing:0.35em; color:rgba(167,139,250,0.3); text-transform:uppercase; margin-top:7px; text-align:center; }

        /* KEYFRAMES */
        @keyframes spinCW   { to { transform:rotate(360deg); } }
        @keyframes spinCCW  { to { transform:rotate(-360deg); } }
        @keyframes pulse    { 0%,100%{opacity:.65;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }
        @keyframes halo     { 0%,100%{box-shadow:0 0 14px rgba(167,139,250,.15),inset 0 0 14px rgba(124,58,237,.06);border-color:rgba(167,139,250,.28)} 50%{box-shadow:0 0 32px rgba(167,139,250,.35),inset 0 0 26px rgba(124,58,237,.14);border-color:rgba(167,139,250,.55)} }
        @keyframes glow     { 0%,100%{filter:drop-shadow(0 0 7px #a78bfa) drop-shadow(0 0 16px rgba(167,139,250,.5))} 50%{filter:drop-shadow(0 0 13px #a78bfa) drop-shadow(0 0 30px rgba(16,185,129,.6)) drop-shadow(0 0 48px rgba(124,58,237,.4))} }
        @keyframes drift    { 0%,100%{transform:translateY(0) translateX(0);opacity:.4} 25%{transform:translateY(-10px) translateX(4px);opacity:.75} 75%{transform:translateY(7px) translateX(-4px);opacity:.25} }
        @keyframes progress { 0%{width:0%} 40%{width:65%} 70%{width:85%} 90%{width:97%} 100%{width:100%} }

        /* STARS */
        .star {
          position:fixed;
          border-radius:50%;
          background:#fff;
          animation:twinkle var(--d,3s) ease-in-out infinite;
          animation-delay:var(--dl,0s);
          opacity:0;
        }
        @keyframes twinkle {
          0%,100%{opacity:0;transform:scale(1)}
          50%{opacity:var(--op,.7);transform:scale(1.3)}
        }
    </style>
</head>
<body>
<!-- Stars scattered around outer edges -->
<div class="star" style="width:2px;height:2px;top:4%;left:8%;   --d:3.2s;--dl:0s;  --op:.6;"></div>
<div class="star" style="width:1px;height:1px;top:8%;left:22%;  --d:4.1s;--dl:.8s; --op:.5;"></div>
<div class="star" style="width:2px;height:2px;top:3%;left:42%;  --d:2.8s;--dl:.3s; --op:.7;"></div>
<div class="star" style="width:1px;height:1px;top:6%;left:62%;  --d:3.7s;--dl:1.2s;--op:.5;"></div>
<div class="star" style="width:2px;height:2px;top:5%;left:80%;  --d:4.4s;--dl:.5s; --op:.65;"></div>
<div class="star" style="width:1px;height:1px;top:2%;left:90%;  --d:3.0s;--dl:2s;  --op:.55;"></div>
<div class="star" style="width:2px;height:2px;top:15%;left:3%;  --d:3.5s;--dl:1s;  --op:.6;"></div>
<div class="star" style="width:1px;height:1px;top:22%;left:93%; --d:2.6s;--dl:.4s; --op:.5;"></div>
<div class="star" style="width:2px;height:2px;top:35%;left:96%; --d:4.2s;--dl:1.5s;--op:.7;"></div>
<div class="star" style="width:1px;height:1px;top:50%;left:2%;  --d:3.8s;--dl:.7s; --op:.55;"></div>
<div class="star" style="width:2px;height:2px;top:65%;left:5%;  --d:3.1s;--dl:2.2s;--op:.6;"></div>
<div class="star" style="width:1px;height:1px;top:72%;left:91%; --d:4.6s;--dl:.2s; --op:.5;"></div>
<div class="star" style="width:2px;height:2px;top:80%;left:15%; --d:2.9s;--dl:1.8s;--op:.65;"></div>
<div class="star" style="width:1px;height:1px;top:85%;left:78%; --d:3.4s;--dl:.9s; --op:.55;"></div>
<div class="star" style="width:2px;height:2px;top:92%;left:55%; --d:4.0s;--dl:.6s; --op:.6;"></div>
<div class="star" style="width:1px;height:1px;top:96%;left:35%; --d:3.6s;--dl:1.4s;--op:.5;"></div>
<div class="star" style="width:2px;height:2px;top:90%;left:88%; --d:2.7s;--dl:2.5s;--op:.7;"></div>
<div class="star" style="width:1px;height:1px;top:18%;left:88%; --d:3.9s;--dl:.1s; --op:.5;"></div>
<div class="star" style="width:2px;height:2px;top:58%;left:97%; --d:4.3s;--dl:1.1s;--op:.6;"></div>
<div class="star" style="width:1px;height:1px;top:42%;left:1%;  --d:3.3s;--dl:1.7s;--op:.55;"></div>

<div class="wrap">

    <div class="stage">
        <div class="p p1"></div><div class="p p2"></div><div class="p p3"></div>
        <div class="p p4"></div><div class="p p5"></div><div class="p p6"></div>

        <div class="blob blob-v"></div>
        <div class="blob blob-e"></div>
        <div class="blob blob-c"></div>

        <!-- Orbital 1 — CW -->
        <svg class="orb1" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%"   stop-color="#7c3aed" stop-opacity=".9"/>
                    <stop offset="100%" stop-color="#10b981" stop-opacity=".55"/>
                </linearGradient>
            </defs>
            <ellipse cx="150" cy="150" rx="136" ry="50" fill="none" stroke="url(#g1)" stroke-width="1.3" opacity=".55" transform="rotate(-25 150 150)"/>
            <circle cx="150" cy="14" r="5" fill="#c4b5fd" opacity=".85">
                <animate attributeName="opacity" values=".5;1;.5" dur="2.2s" repeatCount="indefinite"/>
            </circle>
        </svg>

        <!-- Orbital 2 — CCW -->
        <svg class="orb2" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%"   stop-color="#10b981" stop-opacity=".65"/>
                    <stop offset="100%" stop-color="#6ee7b7" stop-opacity=".25"/>
                </linearGradient>
            </defs>
            <ellipse cx="150" cy="150" rx="104" ry="36" fill="none" stroke="url(#g2)" stroke-width="1" opacity=".5" transform="rotate(38 150 150)"/>
            <circle cx="254" cy="150" r="4" fill="#6ee7b7" opacity=".8">
                <animate attributeName="opacity" values=".35;.9;.35" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
            </circle>
        </svg>

        <div class="halo"></div>
        <div class="core"></div>
        <div class="ering"></div>

        <!-- Bolt -->
        <div class="bolt">
            <svg viewBox="0 0 80 122" width="58" height="88" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="55%" y2="100%">
                        <stop offset="0%"   stop-color="#f0ebff"/>
                        <stop offset="22%"  stop-color="#d8b4fe"/>
                        <stop offset="60%"  stop-color="#a78bfa"/>
                        <stop offset="100%" stop-color="#10b981"/>
                    </linearGradient>
                    <filter id="f"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
                <polygon points="48,2 16,56 32,56 16,120 66,58 44,58" fill="#9060f0" opacity=".28" filter="url(#f)"/>
                <polygon points="48,2 16,56 32,56 16,120 66,58 44,58" fill="url(#bg)"/>
                <polygon points="48,2 32,30 32,56 44,58 66,58" fill="white" opacity=".13"/>
            </svg>
        </div>
    </div>

    <div>
        <div class="wordmark">VOLT</div>
        <div class="tagline">Smart Energy Monitoring</div>
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="progress-label">Initialising systems</div>
    </div>

</div>
</body>
</html>
